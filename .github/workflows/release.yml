name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Package extension
        run: zip unpin-new-child-tab-${GITHUB_REF_NAME}.zip manifest.json background.js LICENSE.md

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" unpin-new-child-tab-${GITHUB_REF_NAME}.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
